<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Report – Campus Lost & Found</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><span class="brand-icon">🔍</span>Campus <span>Lost&Found</span></a>
    <div class="nav-links" id="main-nav"></div>
    <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</nav>

<div class="page-header">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><a href="/my-reports.html">My Reports</a><span>Edit Report</span>
    </nav>
    <h1>Edit Report</h1>
  </div>
</div>

<main class="container container-md" style="padding-bottom:3rem">
  <div id="loading" class="loading-spinner"><div class="spinner"></div></div>
  <div class="card hidden" id="form-card" style="padding:2rem">
    <div id="alert-box" class="alert alert-error hidden" role="alert"></div>
    <form id="edit-form" enctype="multipart/form-data" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="itemName" class="form-label">Item Name <span class="required">*</span></label>
          <input type="text" id="itemName" name="itemName" class="form-control" required maxlength="100" />
        </div>
        <div class="form-group">
          <label for="category" class="form-label">Category <span class="required">*</span></label>
          <select id="category" name="category" class="form-control" required>
            <option>Electronics</option><option>Documents</option><option>Bags</option>
            <option>Keys</option><option>Accessories</option><option>Clothing</option>
            <option>Books</option><option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Description <span class="required">*</span></label>
        <textarea id="description" name="description" class="form-control" rows="4" required minlength="10" maxlength="1000"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dateOccurred" class="form-label">Date <span class="required">*</span></label>
          <input type="date" id="dateOccurred" name="dateOccurred" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="location" class="form-label">Location <span class="required">*</span></label>
          <input type="text" id="location" name="location" class="form-control" required maxlength="150" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Replace Photo (optional)</label>
        <div class="file-upload-area" tabindex="0" role="button">
          <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp" />
          <div>📷 <span style="color:var(--gray-600)">Click to choose new image</span></div>
          <p class="text-small text-muted">JPG, PNG, GIF, WEBP – max 5 MB</p>
        </div>
        <div class="hidden" id="preview-wrap" style="margin-top:.5rem">
          <img id="preview-img" alt="New preview" style="max-height:150px;border-radius:var(--radius)" />
        </div>
      </div>

      <div style="display:flex;gap:1rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.5rem">
        <a href="/my-reports.html" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary" id="submit-btn">Save Changes</button>
      </div>
    </form>
  </div>
</main>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
const itemId = new URLSearchParams(window.location.search).get('id');
if (!itemId) window.location.href = '/my-reports.html';

async function init() {
  const auth = await requireLogin();
  if (!auth) return;

  try {
    const data = await apiFetch(`/api/items/${itemId}`);
    const item = data.item;

    // Only owner or admin
    if (item.reportedBy?._id !== auth.user.id && auth.user.role !== 'admin') {
      showToast('Not authorised.', 'error');
      setTimeout(() => window.location.href = '/my-reports.html', 1200);
      return;
    }

    document.getElementById('itemName').value = item.itemName;
    document.getElementById('category').value = item.category;
    document.getElementById('description').value = item.description;
    document.getElementById('dateOccurred').value = item.dateOccurred.split('T')[0];
    document.getElementById('location').value = item.location;

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('form-card').classList.remove('hidden');
  } catch (err) {
    showToast(err.message, 'error');
    setTimeout(() => window.location.href = '/my-reports.html', 1500);
  }
}

document.getElementById('image').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('Image too large. Max 5 MB.', 'error'); this.value = ''; return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-wrap').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

document.getElementById('edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert-box');
  alertBox.classList.add('hidden');

  const itemName = document.getElementById('itemName').value.trim();
  const category = document.getElementById('category').value;
  const description = document.getElementById('description').value.trim();
  const dateOccurred = document.getElementById('dateOccurred').value;
  const location = document.getElementById('location').value.trim();

  if (!itemName || !category || !description || !dateOccurred || !location) {
    alertBox.textContent = 'Please fill in all required fields.';
    alertBox.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.classList.add('btn-loading');
  btn.disabled = true;

  const fd = new FormData();
  fd.append('itemName', itemName);
  fd.append('category', category);
  fd.append('description', description);
  fd.append('dateOccurred', dateOccurred);
  fd.append('location', location);
  const imgFile = document.getElementById('image').files[0];
  if (imgFile) fd.append('image', imgFile);

  try {
    await apiFetch(`/api/items/${itemId}`, { method: 'PUT', body: fd });
    showToast('Report updated!', 'success');
    setTimeout(() => window.location.href = `/item-details.html?id=${itemId}`, 1200);
  } catch (err) {
    alertBox.textContent = err.message || 'Update failed.';
    alertBox.classList.remove('hidden');
    btn.classList.remove('btn-loading');
    btn.disabled = false;
  }
});

init();
</script>
</body>
</html>

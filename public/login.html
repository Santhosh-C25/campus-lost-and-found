<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Campus Lost & Found</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <div style="font-size:2.5rem;margin-bottom:.5rem">🔍</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <div id="alert-box" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-control" placeholder="alice@student.edu" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Your password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
        Login
      </button>
    </form>

    <p class="text-center mt-3 text-small">
      Don't have an account? <a href="/register.html">Register here</a>
    </p>

    <div style="margin-top:1.5rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius);font-size:.82rem">
      <strong>Demo accounts:</strong><br>
      Admin: admin@campus.edu / Admin@123456<br>
      Student: alice@student.edu / Student@123
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
getAuthState().then(auth => {
  if (auth.loggedIn) {
    window.location.href = auth.user.role === 'admin' ? '/admin/dashboard.html' : '/';
  }
});

const form = document.getElementById('login-form');
const alertBox = document.getElementById('alert-box');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.classList.add('hidden');

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    alertBox.textContent = 'Please enter email and password.';
    alertBox.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.classList.add('btn-loading');
  btn.disabled = true;

  try {
    const data = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    invalidateAuth();
    showToast('Login successful!', 'success');
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) { window.location.href = redirect; return; }
    window.location.href = data.user.role === 'admin' ? '/admin/dashboard.html' : '/';
  } catch (err) {
    alertBox.textContent = err.message || 'Login failed. Please try again.';
    alertBox.classList.remove('hidden');
    btn.classList.remove('btn-loading');
    btn.disabled = false;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Reports – Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><span class="brand-icon">🔍</span>Campus <span>Lost&Found</span></a>
    <div class="nav-links" id="main-nav"></div>
    <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-section">Overview</div>
    <a href="/admin/dashboard.html">📊 Dashboard</a>
    <div class="sidebar-section">Management</div>
    <a href="/admin/reports.html" class="active">📋 Reports</a>
    <a href="/admin/claims.html">🏷️ Claims</a>
    <a href="/admin/users.html">👥 Users</a>
    <div class="sidebar-section">Site</div>
    <a href="/items.html">🔍 Browse Items</a>
    <a href="#" onclick="logout(event)">🚪 Logout</a>
  </aside>

  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">
      <h1 style="margin:0">Manage Reports</h1>
    </div>

    <!-- Filters -->
    <div class="search-section" style="margin-bottom:1.5rem">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Search items…" />
        <button class="btn btn-primary" onclick="loadItems(1)">Search</button>
      </div>
      <div class="filters-row">
        <div class="filter-group">
          <label>Type</label>
          <select id="f-type">
            <option value="">All</option>
            <option>Lost</option><option>Found</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Category</label>
          <select id="f-cat">
            <option value="">All</option>
            <option>Electronics</option><option>Documents</option><option>Bags</option>
            <option>Keys</option><option>Accessories</option><option>Clothing</option>
            <option>Books</option><option>Other</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Status</label>
          <select id="f-status">
            <option value="">All</option>
            <option>Open</option>
            <option value="Claim Pending">Claim Pending</option>
            <option>Resolved</option>
          </select>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Reset</button>
      </div>
    </div>

    <div id="results-info" class="text-muted mb-2" aria-live="polite"></div>

    <div class="table-wrapper">
      <table aria-label="Item reports">
        <thead>
          <tr>
            <th>Item</th>
            <th>Type</th>
            <th>Category</th>
            <th>Location</th>
            <th>Reported By</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" style="text-align:center;padding:2rem"><div class="spinner" style="margin:0 auto"></div></td></tr>
        </tbody>
      </table>
    </div>

    <div id="pagination"></div>
  </main>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><h3>Confirm</h3><button class="modal-close" onclick="document.getElementById('confirm-modal').classList.remove('show')" aria-label="Close">✕</button></div>
    <div class="modal-body"><p id="confirm-message"></p></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('confirm-modal').classList.remove('show')">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
let currentPage = 1;

async function init() {
  await requireAdminRole();
  loadItems(1);
}

function resetFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-cat').value = '';
  document.getElementById('f-status').value = '';
  loadItems(1);
}

async function loadItems(page) {
  currentPage = page;
  const body = document.getElementById('table-body');
  body.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem"><div class="spinner" style="margin:0 auto"></div></td></tr>';

  const params = new URLSearchParams({ page, limit: 15 });
  const search = document.getElementById('search-input').value.trim();
  const type = document.getElementById('f-type').value;
  const cat = document.getElementById('f-cat').value;
  const status = document.getElementById('f-status').value;
  if (search) params.set('search', search);
  if (type) params.set('reportType', type);
  if (cat) params.set('category', cat);
  if (status) params.set('status', status);

  try {
    const data = await apiFetch(`/api/items/admin?${params}`);
    document.getElementById('results-info').textContent = `${data.total} report${data.total !== 1 ? 's' : ''}`;

    if (!data.items || data.items.length === 0) {
      body.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--gray-500)">No reports found.</td></tr>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    body.innerHTML = data.items.map(item => `
      <tr>
        <td><a href="/item-details.html?id=${item._id}" target="_blank"><strong>${escapeHtml(item.itemName)}</strong></a></td>
        <td>${typeBadge(item.reportType)}</td>
        <td>${escapeHtml(item.category)}</td>
        <td class="text-small">${escapeHtml(item.location)}</td>
        <td class="text-small">${escapeHtml(item.reportedBy?.name || '—')}</td>
        <td class="text-small">${formatDate(item.createdAt)}</td>
        <td>${statusBadge(item.status)}</td>
        <td>
          <div class="actions-cell">
            <a href="/item-details.html?id=${item._id}" class="btn btn-ghost btn-sm" target="_blank">View</a>
            ${item.status !== 'Resolved' ? `<button class="btn btn-outline btn-sm" onclick="resolveItem('${item._id}')">Resolve</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${item._id}', '${escapeHtml(item.itemName).replace(/'/g,"\\'")}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');

    buildPagination(document.getElementById('pagination'), page, data.pages, 'loadItems');
  } catch (err) {
    body.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--red)">${escapeHtml(err.message)}</td></tr>`;
  }
}

async function resolveItem(id) {
  showConfirm('Mark this item as resolved?', async () => {
    try {
      await apiFetch(`/api/items/${id}/resolve`, { method: 'PUT' });
      showToast('Marked as resolved.', 'success');
      loadItems(currentPage);
    } catch (err) { showToast(err.message, 'error'); }
  });
}

async function deleteItem(id, name) {
  showConfirm(`Permanently delete "${name}"? All claims will also be deleted.`, async () => {
    try {
      await apiFetch(`/api/items/${id}`, { method: 'DELETE' });
      showToast('Report deleted.', 'success');
      loadItems(currentPage);
    } catch (err) { showToast(err.message, 'error'); }
  });
}

document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadItems(1); });
init();
</script>
</body>
</html>

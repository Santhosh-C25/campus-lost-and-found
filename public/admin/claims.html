<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Claims – Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><span class="brand-icon">🔍</span>Campus <span>Lost&Found</span></a>
    <div class="nav-links" id="main-nav"></div>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-section">Overview</div>
    <a href="/admin/dashboard.html">📊 Dashboard</a>
    <div class="sidebar-section">Management</div>
    <a href="/admin/reports.html">📋 Reports</a>
    <a href="/admin/claims.html" class="active">🏷️ Claims</a>
    <a href="/admin/users.html">👥 Users</a>
    <div class="sidebar-section">Site</div>
    <a href="/items.html">🔍 Browse Items</a>
    <a href="#" onclick="logout(event)">🚪 Logout</a>
  </aside>

  <main class="admin-main">
    <h1 style="margin-bottom:1.5rem">Manage Claims</h1>

    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <button class="tab-btn active" onclick="filterStatus('', this)">All</button>
      <button class="tab-btn" onclick="filterStatus('Pending', this)">Pending</button>
      <button class="tab-btn" onclick="filterStatus('Approved', this)">Approved</button>
      <button class="tab-btn" onclick="filterStatus('Rejected', this)">Rejected</button>
    </div>

    <div id="results-info" class="text-muted mb-2" aria-live="polite"></div>

    <div class="table-wrapper">
      <table aria-label="Claims list">
        <thead>
          <tr>
            <th>Item</th>
            <th>Claimed By</th>
            <th>Submitted</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" style="text-align:center;padding:2rem"><div class="spinner" style="margin:0 auto"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div id="pagination"></div>
  </main>
</div>

<!-- Review modal -->
<div class="modal-overlay" id="review-modal" role="dialog" aria-modal="true" aria-labelledby="review-title">
  <div class="modal">
    <div class="modal-header">
      <h3 id="review-title">Review Claim</h3>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div id="review-claim-info" style="background:var(--gray-50);padding:1rem;border-radius:var(--radius);margin-bottom:1.25rem;font-size:.9rem"></div>
      <div class="form-group">
        <label for="admin-notes" class="form-label">Admin Notes (optional)</label>
        <textarea id="admin-notes" class="form-control" rows="3" placeholder="Reason for approval or rejection…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="submitReview('Rejected')">Reject</button>
      <button class="btn btn-primary" onclick="submitReview('Approved')">Approve</button>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><h3>Confirm Delete</h3><button class="modal-close" onclick="document.getElementById('confirm-modal').classList.remove('show')" aria-label="Close">✕</button></div>
    <div class="modal-body"><p id="confirm-message"></p></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('confirm-modal').classList.remove('show')">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
let currentPage = 1;
let currentStatus = '';
let reviewClaimId = null;

async function init() {
  await requireAdminRole();
  loadClaims(1);
}

function filterStatus(status, btn) {
  currentStatus = status;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadClaims(1);
}

async function loadClaims(page) {
  currentPage = page;
  const body = document.getElementById('table-body');
  body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem"><div class="spinner" style="margin:0 auto"></div></td></tr>';

  const params = new URLSearchParams({ page, limit: 15 });
  if (currentStatus) params.set('status', currentStatus);

  try {
    const data = await apiFetch(`/api/claims/admin/all?${params}`);
    document.getElementById('results-info').textContent = `${data.total} claim${data.total !== 1 ? 's' : ''}`;

    if (!data.claims || data.claims.length === 0) {
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--gray-500)">No claims found.</td></tr>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    body.innerHTML = data.claims.map(c => `
      <tr>
        <td>
          <a href="/item-details.html?id=${c.item?._id}" target="_blank"><strong>${escapeHtml(c.item?.itemName || '—')}</strong></a>
          <div class="text-small text-muted">${typeBadge(c.item?.reportType || '')}</div>
        </td>
        <td>
          <div class="bold text-small">${escapeHtml(c.claimedBy?.name || '—')}</div>
          <div class="text-small text-muted">${escapeHtml(c.claimedBy?.email || '')}</div>
        </td>
        <td class="text-small">${timeAgo(c.createdAt)}</td>
        <td>${claimStatusBadge(c.status)}</td>
        <td>
          <div class="actions-cell">
            ${c.status === 'Pending' ? `<button class="btn btn-primary btn-sm" onclick="openReview('${c._id}', ${JSON.stringify(c).replace(/</g,'&lt;')})">Review</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteClaim('${c._id}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');

    buildPagination(document.getElementById('pagination'), page, data.pages, 'loadClaims');
  } catch (err) {
    body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--red)">${escapeHtml(err.message)}</td></tr>`;
  }
}

function openReview(claimId, claim) {
  reviewClaimId = claimId;
  document.getElementById('admin-notes').value = '';
  document.getElementById('review-claim-info').innerHTML = `
    <div><strong>Item:</strong> ${escapeHtml(claim.item?.itemName || '—')}</div>
    <div><strong>Claimant:</strong> ${escapeHtml(claim.claimedBy?.name || '—')} (${escapeHtml(claim.claimedBy?.email || '')})</div>
    <div style="margin-top:.5rem"><strong>Explanation:</strong><br>${escapeHtml(claim.explanation)}</div>
    ${claim.identifyingDetails ? `<div style="margin-top:.5rem"><strong>Identifying Details:</strong><br>${escapeHtml(claim.identifyingDetails)}</div>` : ''}
    <div style="margin-top:.5rem;color:var(--gray-500);font-size:.8rem">Submitted ${timeAgo(claim.createdAt)}</div>
  `;
  document.getElementById('review-modal').classList.add('show');
}

function closeModal() { document.getElementById('review-modal').classList.remove('show'); }

async function submitReview(status) {
  if (!reviewClaimId) return;
  const adminNotes = document.getElementById('admin-notes').value.trim();
  try {
    await apiFetch(`/api/claims/admin/${reviewClaimId}/review`, {
      method: 'PUT',
      body: JSON.stringify({ status, adminNotes }),
    });
    showToast(`Claim ${status.toLowerCase()}.`, 'success');
    closeModal();
    loadClaims(currentPage);
  } catch (err) { showToast(err.message, 'error'); }
}

async function deleteClaim(id) {
  showConfirm('Delete this claim permanently?', async () => {
    try {
      await apiFetch(`/api/claims/admin/${id}`, { method: 'DELETE' });
      showToast('Claim deleted.', 'success');
      loadClaims(currentPage);
    } catch (err) { showToast(err.message, 'error'); }
  });
}

init();
</script>
</body>
</html>

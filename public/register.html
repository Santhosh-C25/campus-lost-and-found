<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Campus Lost & Found</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <div style="font-size:2.5rem;margin-bottom:.5rem">🔍</div>
      <h2>Create Account</h2>
      <p>Join the Campus Lost & Found community</p>
    </div>

    <div id="alert-box" class="alert alert-error hidden" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="name" class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Alice Johnson" required autocomplete="name" />
          <div class="form-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="studentId" class="form-label">Student ID</label>
          <input type="text" id="studentId" name="studentId" class="form-control" placeholder="STU001" autocomplete="off" />
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-control" placeholder="alice@student.edu" required autocomplete="email" />
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="department" class="form-label">Department</label>
        <input type="text" id="department" name="department" class="form-control" placeholder="Computer Science" autocomplete="organization" />
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1-555-0100" autocomplete="tel" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6" />
        <div class="form-hint">At least 6 characters.</div>
        <div class="form-error" id="password-error"></div>
      </div>

      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirm-password" name="confirmPassword" class="form-control" placeholder="Repeat password" required autocomplete="new-password" />
        <div class="form-error" id="confirm-error"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
        Create Account
      </button>
    </form>

    <p class="text-center mt-3 text-small">
      Already have an account? <a href="/login.html">Login here</a>
    </p>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
// Redirect if already logged in
getAuthState().then(auth => { if (auth.loggedIn) window.location.href = '/'; });

const form = document.getElementById('register-form');
const alertBox = document.getElementById('alert-box');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.classList.add('hidden');
  clearErrors();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm-password').value;
  const studentId = document.getElementById('studentId').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const department = document.getElementById('department').value.trim();

  // Client-side validation
  let valid = true;
  if (!name || name.length < 2) { showFieldError('name-error', 'Name must be at least 2 characters.'); valid = false; }
  if (!email || !/^\S+@\S+\.\S+$/.test(email)) { showFieldError('email-error', 'Please enter a valid email.'); valid = false; }
  if (!password || password.length < 6) { showFieldError('password-error', 'Password must be at least 6 characters.'); valid = false; }
  if (password !== confirm) { showFieldError('confirm-error', 'Passwords do not match.'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('submit-btn');
  btn.classList.add('btn-loading');
  btn.disabled = true;

  try {
    const data = await apiFetch('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password, studentId, phone, department }),
    });
    invalidateAuth();
    showToast('Registration successful! Welcome aboard 🎉', 'success');
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    setTimeout(() => window.location.href = redirect, 1000);
  } catch (err) {
    showAlert(err.message || 'Registration failed. Please try again.');
    btn.classList.remove('btn-loading');
    btn.disabled = false;
  }
});

function showAlert(msg) {
  alertBox.textContent = msg;
  alertBox.classList.remove('hidden');
}
function showFieldError(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.classList.add('show'); }
}
function clearErrors() {
  document.querySelectorAll('.form-error').forEach(e => { e.textContent = ''; e.classList.remove('show'); });
}
</script>
</body>
</html>
